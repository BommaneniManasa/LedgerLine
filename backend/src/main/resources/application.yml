spring:
  application:
    name: ledgerline
  datasource:
    # No defaults on purpose: the app refuses to start if these are missing.
    url: ${LEDGERLINE_DB_URL}
    username: ${LEDGERLINE_DB_USER}
    password: ${LEDGERLINE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # the schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false       # Redis is only used for rate-limit counters, never for Spring Data repositories

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:${SERVER_PORT:8080}}     # hosting platforms (e.g. Render) inject PORT; default stays 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

ledgerline:
  jwt:
    secret: ${LEDGERLINE_JWT_SECRET}            # required, at least 32 bytes
    issuer: ledgerline
    expiry: PT30M
  cors:
    allowed-origins: ${LEDGERLINE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  money:
    supported-currencies: INR,USD,EUR
    max-transaction-amount: 1000000.00
    max-accounts-per-user: 5
  security:
    max-failed-logins: 5
    lock-duration: PT15M
  rate-limit:
    # OFF by default (local development, tests). Production: set LEDGERLINE_RATE_LIMIT_ENABLED=true
    # together with LEDGERLINE_REDIS_URL. When ON and Redis is unreachable, login/register answer 503 (fail closed).
    enabled: ${LEDGERLINE_RATE_LIMIT_ENABLED:false}
    redis-url: ${LEDGERLINE_REDIS_URL:}
    trusted-proxy-hops: ${LEDGERLINE_TRUSTED_PROXY_HOPS:0}   # 0 = ignore X-Forwarded-For (see docs/DEPLOYMENT.md)
    login-ip:         { limit: 20, window: PT5M }    # per client IP
    login-identifier: { limit: 10, window: PT15M }   # per e-mail (HMAC-hashed in Redis)
    register-ip:      { limit: 5,  window: PT1H }    # per client IP
  bootstrap:
    # Optional: creates the first ADMIN on startup if this email does not exist yet.
    admin-email: ${LEDGERLINE_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${LEDGERLINE_BOOTSTRAP_ADMIN_PASSWORD:}
